spring.application.name=SpringBootBackend
server.port=${PORT:8080}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
